# Builds Orrery's packages: the portable zips for Windows, Linux and macOS, the Windows installer, and the Linux .deb,
# .rpm and AppImage. Orrery uses a Devolutions.IronRdp that isn't on nuget.org: the IronRDP fork builds and releases it
# (its orrery-nuget.yml), and build/ironrdp-package.json names that release and its SHA-256. The packages end up as
# this run's artifacts; a v* tag also puts them in a draft GitHub release, with SHA256SUMS and attestations, for
# publishing by hand. See docs/packaging.md, "GitHub Actions" and "Releasing".
#
# Supply chain: every action is pinned by commit, and every tool downloaded here is pinned by version and checked
# against a SHA-256 before it runs. Only the release job can write to the repository.

name: Packages

# Pushes build only on dev and main (and v* tags); other branches build when merged, or by hand with Run workflow.
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run. Tag builds always finish.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The SDK the lock files were made with.
  DOTNET_SDK_VERSION: 10.0.403
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # MSBuild reads this as a property, so every restore in a job, the test step's included, is locked.
  OrreryLockedRestore: 'true'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      ironrdp-url: ${{ steps.published.outputs.ironrdp-url }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out Orrery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build/ironrdp-package.json must describe Orrery's IronRdpVersion, with a url and SHA-256, so a version bump
      # fails here, not halfway through a restore, until the fork has released the package.
      - name: Find the published IronRDP package
        id: published
        run: |
          $Version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.IronRdpVersion | Where-Object { $_ } | Select-Object -First 1
          $Package = Get-Content -Raw build/ironrdp-package.json | ConvertFrom-Json
          if ($Package.version -ne $Version) { throw "build/ironrdp-package.json is for $($Package.version), not IronRdpVersion $Version. Release the package from the fork first (docs/packaging.md)." }
          if ($Package.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw "build/ironrdp-package.json's sha256 '$($Package.sha256)' isn't a SHA-256." }
          if ($Package.url -notmatch '^https://') { throw "build/ironrdp-package.json's url '$($Package.url)' isn't an https URL." }
          Write-Host "Devolutions.IronRdp $Version from $($Package.url) ($($Package.repository)@$($Package.commit))"
          "ironrdp-url=$($Package.url)" >> $Env:GITHUB_OUTPUT
        shell: pwsh

      # The version every job builds. A release's files are named for it and Orrery finds updates by tag, so a tag
      # must agree with <Version> before anything is built: v<Version> exactly, or a preview of it. A preview tag
      # (v0.2.0-preview.1 with <Version> 0.2.0) builds as the tag's version, so a preview needs no commit of its own.
      # Anything else builds as <Version>.
      - name: Version
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAG: ${{ github.ref_name }}
        run: |
          $Version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $Pattern = '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'
          if ($Version -cnotmatch $Pattern) { throw "<Version> $Version in Directory.Build.props isn't a version like 1.2.3 or 1.2.3-preview.1." }
          if ($Env:IS_TAG -eq 'true') {
            $Tagged = $Env:TAG.Substring(1)
            $Numbers = ($Version -split '-')[0]
            if ($Tagged -cnotmatch $Pattern -or ($Tagged -cne $Version -and -not $Tagged.StartsWith("$Numbers-"))) {
              throw "The tag $($Env:TAG) doesn't match <Version> $Version in Directory.Build.props. Tag v$Version, or v$Numbers-preview.<n> for a preview of it; for another version, bump <Version> and commit it first (docs/packaging.md, Releasing)."
            }
            $Version = $Tagged
            Write-Host "Releasing Orrery $Version"
          }
          "version=$Version" >> $Env:GITHUB_OUTPUT
        shell: pwsh

  windows:
    name: Windows
    needs: [preflight]
    runs-on: windows-2025
    env:
      ORRERY_VERSION: ${{ needs.preflight.outputs.version }}
    permissions:
      contents: read
      # SignPath reads the job's details and downloads the artifact it's asked to sign with this token.
      actions: read

    steps:
      - name: Check out Orrery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare-orrery
        with:
          ironrdp-url: ${{ needs.preflight.outputs.ironrdp-url }}

      - name: Test
        run: dotnet test Orrery.sln --disable-build-servers -nodeReuse:false
        shell: pwsh

      - name: Portable zips
        run: ./build/package.ps1 -Runtimes win-x64,win-arm64 -Version $Env:ORRERY_VERSION
        shell: pwsh

      # Inno Setup 7.1.1 from its GitHub release. jrsoftware publishes no checksums (it signs the installer and
      # publishes .issig signatures), so the SHA-256 is the asset digest GitHub shows for the release, checked
      # 2026-11-01.
      - name: Install Inno Setup 7
        id: inno
        run: |
          $Url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $Sha256 = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          $Installer = Join-Path $Env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $Dir = Join-Path $Env:RUNNER_TEMP 'InnoSetup7'
          Invoke-WebRequest $Url -OutFile $Installer
          $Actual = (Get-FileHash $Installer -Algorithm SHA256).Hash
          if ($Actual -ne $Sha256) { throw "innosetup-7.1.1-x64.exe has SHA-256 $Actual, expected $Sha256." }
          $Process = Start-Process $Installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/NOICONS', "/DIR=`"$Dir`"")
          if ($Process.ExitCode -ne 0) { throw "The Inno Setup installer failed with exit code $($Process.ExitCode)." }
          $Iscc = Join-Path $Dir 'ISCC.exe'
          if (-not (Test-Path $Iscc)) { throw "$Iscc is missing after installing Inno Setup." }
          "iscc=$Iscc" >> $Env:GITHUB_OUTPUT
        shell: pwsh

      # A release is signed through SignPath Foundation once the repository has the SIGNPATH_ORGANIZATION_ID and
      # SIGNPATH_PROJECT_SLUG variables and the SIGNPATH_API_TOKEN secret (docs/code-signing.md). Only tags are signed,
      # since each request is approved by hand; everything else is built unsigned, as before.
      - name: Signing
        id: signing
        env:
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $Sign = $Env:IS_TAG -eq 'true' -and -not [string]::IsNullOrEmpty($Env:ORGANIZATION)
          "sign=$($Sign.ToString().ToLowerInvariant())" >> $Env:GITHUB_OUTPUT
          if ($Env:IS_TAG -eq 'true' -and -not $Sign) { Write-Host "::warning::SignPath isn't set up, so this release's Windows files are unsigned." }
        shell: pwsh

      # Orrery's own files only: the portable executables, and in the installer's publish Orrery.exe and Orrery's
      # DLLs. Third-party DLLs keep their own signatures, or none.
      - name: Gather the files to sign
        if: steps.signing.outputs.sign == 'true'
        run: |
          ./build/Build-Installer.ps1 -PublishOnly -Version $Env:ORRERY_VERSION
          $Version = $Env:ORRERY_VERSION
          $ToSign = 'artifacts/to-sign'
          foreach ($Arch in 'x64', 'arm64') {
            New-Item -ItemType Directory -Force "$ToSign/portable-win-$Arch" | Out-Null
            Copy-Item "artifacts/Orrery-$Version-win-$Arch-portable/Orrery.exe" "$ToSign/portable-win-$Arch/"
          }
          New-Item -ItemType Directory -Force "$ToSign/installed" | Out-Null
          Copy-Item artifacts/installer-publish/Orrery.exe, artifacts/installer-publish/Orrery.dll, artifacts/installer-publish/Orrery.*.dll "$ToSign/installed/"
          Get-ChildItem -Recurse -File $ToSign | ForEach-Object { $_.FullName }
        shell: pwsh

      - name: Upload the files to sign
        id: upload-to-sign
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-windows-files
          path: artifacts/to-sign/
          if-no-files-found: error

      - name: Sign the files
        if: steps.signing.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: files
          github-artifact-id: ${{ steps.upload-to-sign.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed

      # The signed files go back where they came from, and the portable zips are made again around them.
      - name: Use the signed files
        if: steps.signing.outputs.sign == 'true'
        run: |
          $Version = $Env:ORRERY_VERSION
          foreach ($Arch in 'x64', 'arm64') {
            Copy-Item -Force "artifacts/signed/portable-win-$Arch/Orrery.exe" "artifacts/Orrery-$Version-win-$Arch-portable/"
          }
          Copy-Item -Force artifacts/signed/installed/* artifacts/installer-publish/
          $Unsigned = @(Get-ChildItem artifacts/Orrery-*-win-*-portable/Orrery.exe, artifacts/installer-publish/Orrery.exe, artifacts/installer-publish/Orrery.dll, artifacts/installer-publish/Orrery.*.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          if ($Unsigned) { throw "Not signed: $($Unsigned.FullName -join ', ')" }
          ./build/package.ps1 -Runtimes win-x64,win-arm64 -RezipOnly -Version $Env:ORRERY_VERSION
        shell: pwsh

      - name: Installer
        env:
          ISCC_PATH: ${{ steps.inno.outputs.iscc }}
          SIGNED: ${{ steps.signing.outputs.sign }}
        run: |
          # Signed, the setup is built from the publish whose files were just signed.
          if ($Env:SIGNED -eq 'true') { ./build/Build-Installer.ps1 -IsccPath $Env:ISCC_PATH -Version $Env:ORRERY_VERSION -SkipPublish }
          else { ./build/Build-Installer.ps1 -IsccPath $Env:ISCC_PATH -Version $Env:ORRERY_VERSION }
        shell: pwsh

      - name: Upload the setup to sign
        id: upload-setup
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-windows-setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Sign the setup
        if: steps.signing.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed-setup

      - name: Use the signed setup
        if: steps.signing.outputs.sign == 'true'
        run: |
          $Setup = Get-ChildItem artifacts/signed-setup -Filter 'Orrery-Setup-*.exe' -Recurse | Select-Object -First 1
          if (-not $Setup) { throw 'SignPath returned no Orrery-Setup-*.exe.' }
          if ((Get-AuthenticodeSignature $Setup.FullName).Status -ne 'Valid') { throw "$($Setup.Name) isn't validly signed." }
          Copy-Item -Force $Setup.FullName artifacts/installer/
        shell: pwsh

      - name: Upload portable zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orrery-windows-portable
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orrery-windows-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    needs: [preflight]
    runs-on: ubuntu-24.04
    env:
      ORRERY_VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - name: Check out Orrery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare-orrery
        with:
          ironrdp-url: ${{ needs.preflight.outputs.ironrdp-url }}

      - name: Portable zips
        run: ./build/package.ps1 -Runtimes linux-x64,linux-arm64 -Version $Env:ORRERY_VERSION
        shell: pwsh

      # nfpm's hash is from the checksums.txt in its v2.48.0 release. appimagetool 1.9.1 and type2-runtime 20251108
      # publish no checksum files, so theirs are the asset digests GitHub shows for those releases, checked
      # 2026-11-01. appimagetool's "continuous" release changes under the same name, so it's the tagged 1.9.1, and the
      # runtime it embeds is passed in rather than downloaded from type2-runtime's "continuous" release. Both
      # architectures' AppImages are built here on x86_64: appimagetool only packs the AppDir behind the matching
      # runtime.
      - name: Install nfpm and appimagetool
        id: tools
        run: |
          $Tools = Join-Path $Env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory -Force $Tools | Out-Null
          $Downloads = @(
            @{ Url = 'https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz'
               Sha256 = '6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750' }
            @{ Url = 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
               Sha256 = 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' }
            @{ Url = 'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64'
               Sha256 = '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d' }
            @{ Url = 'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64'
               Sha256 = '00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444' }
          )
          foreach ($Download in $Downloads) {
            $File = Join-Path $Tools ($Download.Url -split '/')[-1]
            Invoke-WebRequest $Download.Url -OutFile $File
            $Actual = (Get-FileHash $File -Algorithm SHA256).Hash
            if ($Actual -ne $Download.Sha256) { throw "$File has SHA-256 $Actual, expected $($Download.Sha256)." }
          }
          tar -xzf (Join-Path $Tools 'nfpm_2.48.0_Linux_x86_64.tar.gz') -C $Tools nfpm
          if ($LASTEXITCODE -ne 0) { throw 'Unpacking nfpm failed.' }
          chmod +x (Join-Path $Tools 'appimagetool-x86_64.AppImage')
          "nfpm=$(Join-Path $Tools 'nfpm')" >> $Env:GITHUB_OUTPUT
          "appimagetool=$(Join-Path $Tools 'appimagetool-x86_64.AppImage')" >> $Env:GITHUB_OUTPUT
          "runtimes=$Tools" >> $Env:GITHUB_OUTPUT
        shell: pwsh

      # The .deb and .rpm are signed when the repository has the LINUX_SIGNING_KEY secret (an ASCII-armored OpenPGP
      # secret key) and LINUX_SIGNING_PASSPHRASE; build/linux-signing-key.asc is its public half. Without them they're
      # built unsigned, as before (docs/code-signing.md).
      - name: Signing key
        id: signing
        env:
          KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            if [ "$IS_TAG" = true ]; then echo "::warning::No LINUX_SIGNING_KEY, so this release's .deb and .rpm are unsigned."; fi
            exit 0
          fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/linux-signing-key.asc"
          echo "key=$RUNNER_TEMP/linux-signing-key.asc" >> "$GITHUB_OUTPUT"
        shell: bash

      # The runner has no FUSE for mounting appimagetool's own image, so it unpacks itself and runs from there.
      - name: Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NFPM_PATH: ${{ steps.tools.outputs.nfpm }}
          APPIMAGETOOL_PATH: ${{ steps.tools.outputs.appimagetool }}
          APPIMAGE_RUNTIME_DIR: ${{ steps.tools.outputs.runtimes }}
          SIGNING_KEY: ${{ steps.signing.outputs.key }}
          NFPM_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: |
          $Sign = if ($Env:SIGNING_KEY) { @{ SigningKey = $Env:SIGNING_KEY } } else { @{} }
          ./build/Build-LinuxPackages.ps1 -Version $Env:ORRERY_VERSION -NfpmPath $Env:NFPM_PATH -AppImageToolPath $Env:APPIMAGETOOL_PATH -AppImageRuntimeDir $Env:APPIMAGE_RUNTIME_DIR @Sign
        shell: pwsh

      # Checked against the public key in the repository, the one users import, so a wrong key or a missing signature
      # fails here rather than on someone's machine. The key then goes with the packages, for the release.
      - name: Check the signatures
        if: steps.signing.outputs.key != ''
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/linux-signing-key.asc"
          public="$PWD/build/linux-signing-key.asc"
          if [ ! -f "$public" ]; then echo "::error::build/linux-signing-key.asc is missing: commit the signing key's public half."; exit 1; fi
          command -v rpm > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rpm; }
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import "$public"
          for deb in "$PWD"/artifacts/linux/*.deb; do
            parts="$(mktemp -d)"
            (cd "$parts" && ar x "$deb")
            if [ ! -f "$parts/_gpgorigin" ]; then echo "::error::$(basename "$deb") isn't signed."; exit 1; fi
            cat "$parts/debian-binary" "$parts"/control.tar.* "$parts"/data.tar.* | gpg --batch --verify "$parts/_gpgorigin" -
            echo "$(basename "$deb"): signature OK"
          done
          db="$(mktemp -d)"
          rpm --dbpath "$db" --import "$public"
          for package in artifacts/linux/*.rpm; do
            result="$(rpm --dbpath "$db" -K "$package")"
            echo "$result"
            case "$result" in *"signatures OK"*) ;; *) echo "::error::$(basename "$package") isn't signed with this key."; exit 1 ;; esac
          done
          cp "$public" artifacts/linux/orrery-linux-signing-key.asc
        shell: bash

      - name: Upload portable zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orrery-linux-portable
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orrery-linux-packages
          path: |
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/linux/*.AppImage
            artifacts/linux/*.asc
          if-no-files-found: error

  macos:
    name: macOS
    needs: [preflight]
    runs-on: macos-15
    env:
      ORRERY_VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - name: Check out Orrery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare-orrery
        with:
          ironrdp-url: ${{ needs.preflight.outputs.ironrdp-url }}

      - name: Portable zips
        run: ./build/package.ps1 -Runtimes osx-arm64,osx-x64 -Version $Env:ORRERY_VERSION
        shell: pwsh

      - name: Upload portable zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orrery-macos-portable
          path: artifacts/*.zip
          if-no-files-found: error

  # A v* tag: every package from the jobs above, with SHA256SUMS (which Orrery checks updates against) and GitHub
  # artifact attestations, in a draft release. Nothing is public until someone looks the draft over and publishes it.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      # Creating the release and uploading its files.
      contents: write
      # Signing the attestations with the workflow's identity, and storing them.
      id-token: write
      attestations: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: orrery-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*)
          if (( ${#files[@]} == 0 )); then echo "No packages were downloaded." >&2; exit 1; fi
          sha256sum -- "${files[@]}" > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
        shell: bash

      - name: Attest the packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      # A tag with a "-" (v0.2.0-preview.1) is a preview, which Orrery offers only to those who asked for previews.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag --generate-notes --title "Orrery ${TAG#v}")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY" release/*
        shell: bash
